services:
  diu-question-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: diu-question-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DIU_LOG_LEVEL=INFO
      - DIU_SERVER_HOST=0.0.0.0
      - DIU_SERVER_PORT=8000
    volumes:
      - diu_data:/app/data

volumes:
  diu_data:
    driver: local
